name: Reusable Docker Build and Publish steps
description: Build a Docker image and optionally publish branch tags to GHCR.

inputs:
  push_to_ghcr:
    description: Whether to push the built image to GHCR
    required: true
  image_name:
    description: GHCR image name without registry or organization
    required: true
  github_token:
    description: GitHub token used only when publishing is enabled
    required: true
  context_dir:
    description: Docker build context relative to the repository root
    required: false
    default: token-service
  platforms:
    description: Comma-separated OCI target platforms
    required: false
    default: linux/amd64,linux/arm64
  load:
    description: >-
      Build into the runner's Docker daemon instead of publishing, so the image
      can be scanned before it exists in a registry. Forces a single platform:
      `docker load` cannot accept a multi-platform manifest.
    required: false
    default: 'false'

outputs:
  digest:
    description: Immutable multi-platform image digest
    value: ${{ steps.build.outputs.digest }}
  local_tag:
    description: Tag of the locally loaded image. Set only when `load` is true.
    value: ${{ steps.local.outputs.tag }}

runs:
  using: 'composite'
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Extract Metadata
    id: meta
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  - name: Name the local scan image
    if: ${{ inputs.load == 'true' }}
    id: local
    shell: bash
    run: echo "tag=${{ inputs.image_name }}:scan-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  - name: Build and Push Docker image
    id: build
    uses: docker/build-push-action@v7
    with:
      context: ${{ inputs.context_dir }}
      # `load` builds one architecture into the local daemon; the publishing
      # pass that follows still builds the full platform list, and the gha
      # cache makes the shared layers a hit rather than a rebuild.
      platforms: ${{ inputs.load == 'true' && 'linux/amd64' || inputs.platforms }}
      push: ${{ inputs.push_to_ghcr }}
      load: ${{ inputs.load }}
      provenance: mode=max
      sbom: true
      tags: ${{ inputs.load == 'true' && steps.local.outputs.tag || steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
