name: Reusable Node Validation steps
description: Install token-service dependencies and run the Node test suite.

inputs:
  node_version:
    description: Node.js version to install.
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ inputs.node_version }}
      cache: npm
      cache-dependency-path: token-service/package-lock.json

  - name: Install dependencies
    shell: bash
    run: npm ci
    working-directory: token-service

  - name: Test policy gateway
    shell: bash
    run: |
      container="livekit-lifecycle-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
      docker run -d --name "$container" -p 127.0.0.1::6379 redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      port=$(docker port "$container" 6379/tcp | sed 's/.*://')
      export LIFECYCLE_TEST_REDIS_URL="redis://127.0.0.1:$port"
      npm test
    working-directory: token-service
