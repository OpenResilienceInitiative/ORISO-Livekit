name: Reusable Node Validation steps
description: Install token-service dependencies and run the Node test suite.

inputs:
  node_version:
    description: Node.js version to install.
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ inputs.node_version }}
      cache: npm
      cache-dependency-path: token-service/package-lock.json

  - name: Install dependencies
    shell: bash
    run: npm ci
    working-directory: token-service

  - name: Test policy gateway
    shell: bash
    run: npm test
    working-directory: token-service
